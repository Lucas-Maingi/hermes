x-hermes-environment: &hermes-environment
  HERMES_DB: /app/data/hermes.db
  HERMES_INVITE_TOKEN: ${HERMES_INVITE_TOKEN:?Set a private HERMES_INVITE_TOKEN}
  HERMES_ENCRYPTION_KEY: ${HERMES_ENCRYPTION_KEY:?Set and preserve HERMES_ENCRYPTION_KEY}
  HERMES_RETENTION_DAYS: ${HERMES_RETENTION_DAYS:-365}
  HERMES_LLM_PROVIDER: ${HERMES_LLM_PROVIDER:-auto}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HERMES_CHAT_API_TOKEN: ${HERMES_CHAT_API_TOKEN:-}
  WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v26.0}

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment: *hermes-environment
    volumes:
      - hermes-data:/app/data

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment: *hermes-environment
    volumes:
      - hermes-data:/app/data

volumes:
  hermes-data:
